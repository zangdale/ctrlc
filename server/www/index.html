<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>都复制了啥!!!</title>
</head>

<style>
  body {
    padding: 0;
    margin: 0;
    background-color: lightblue;
  }

  h1 {
    color: white;
    text-align: center;
  }

  #msgg {
    text-align: center;
  }

  .pmsg {
    /* background-color: #4CAF50; */
    font-size: 16px;
    color: rgb(119, 164, 138);
    padding: 5px 8px;
  }

  .mbutton {
    background-color: #93cd94;
    border: none;
    color: white;
    margin-left: 10px;
    padding: 1px 8px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
  }
  .omsg{
    background-color: #caefcb;
    margin: 10px;
  }
  .lmsg{
    margin: 10px;
    color: rgb(71, 112, 87);
  }
</style>

<body>
  <div id="app"></div>

  <template id="body">
    <h1>{{title}}</h1>
    <span id="msgg">
      <p class="pmsg">
        消息: <input type="text" name="search" v-model="addMsg" />
        <button class="mbutton" type="submit" @click="addMsgFunc">添加消息</button>
      </p>
      <p class="pmsg">内容: <input type="text" name="search" v-model="searchMsg" /></p>
      <p class="pmsg">数量: <input type="number" v-model="count" /></p>
      <p class="pmsg">偏移量: <input type="number" v-model="offset" /></p>
      <p class="pmsg">
        <button class="mbutton" type="submit" @click="getIps">获取IPs</button>
        <button class="mbutton" type="submit" @click="getAndSearchMsgs">查询</button>
      </p>
    </span>
    <ol class="omsg">
      <li class="lmsg" v-for="ip in ips">{{ip}}</li>
    </ol>
    <ol class="omsg">
      <li class="lmsg" v-for="msg in ctrlcMsgs">{{ msg }}</li>
    </ol>
    <ol class="omsg">
      <li class="lmsg" v-for="m in searchMsgs">{{m.Body}}</li>
    </ol>
  </template>

  <script src="vue.global.js"></script>
  <script src="axios.min.js"></script>
  <script>
    Vue.createApp({
      template: "#body",
      data() {
        return {
          title: "hello ctrlc !!!",
          search: "search !!!",
          ctrlcMsgs: [],
          ips:[],
          addMsg:"",
          searchMsg: "",
          count: 30,
          offset: 0,
          searchMsgs: [],
        };
      },
      props: {},
      computed: {},
      watch: {},
      methods: {
        getAndSearchMsgs() {
          // var msgs = this.searchMsgs;
          axios.get("/get", {
              params: {
                count: this.count,
                offset: this.offset,
                search: this.searchMsg,
              },
            })
            .then((response) => {
              // console.log(response);
              this.searchMsgs = response.data.data;
              // console.log(msgs);
            })
            .catch((error) => {
              console.log(error);
            });

          // this.searchMsgs = msgs;
          console.log(this.searchMsgs);
        },
        getIps(){
          axios.get("/getips")
            .then((response) => {
              // console.log(response);
              this.ips = response.data.data;
              // console.log(msgs);
            })
            .catch((error) => {
              console.log(error);
            });
          console.log(this.ips);
        },
        addMsgFunc(){
          let data = {"msg":this.addMsg}
          axios.post("/addmsg",data)
            .then((response) => {
              console.log(response.data.data);
              // this.ips = response.data.data;
              // console.log(msgs);
            })
            .catch((error) => {
              console.log(error);
            });
          // console.log(this.ips);
        },
      },
      created() {
        // console.log(this.ctrlcMsgs);
        var msgs = this.ctrlcMsgs; // == msgs=this.ctrlcMsgs 都是赋值指针类型
        const source = new EventSource("/msgs");
        source.addEventListener("open", function (event) {
          console.log("eventsource connection open");
        });
        source.addEventListener("error", function (event) {
          if (event.target.readyState === 0) {
            console.log("reconnecting to eventsource");
          } else {
            console.error("eventsource error");
          }
        });
        source.addEventListener("message", function (event) {
          console.log(event.data);
          // msgs.push(event.data);// 向后追加
          msgs.unshift(event.data); // 向前追加
          // console.log("msgs:", msgs);
        });
      },
    }).mount("#app");

    function getMsgs(count, offset, search) {

      var res = {}
      axios
        .get("/get", {
          params: {
            count: count,
            offset: offset,
            search: search,
          },
        })
        .then(function (response) {
          console.log(response);
          // return response;
          res = response;
        })
        .catch(function (error) {
          console.log(error);
        })
        .then(function () {
          // always executed
        });
      console.log("resssss", res)
      return res;
    }
    console.log("js run end ...");
  </script>
</body>

</html>
