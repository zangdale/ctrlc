<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>都复制了啥!!!</title>
  </head>

  <style>
    body {
      padding: 0;
      margin: 0;
    }
    #left {
      float: left;
      width: 50%;
      height: 100%;
      background-color: rgba(46, 53, 41, 0.096);
    }
    #right {
      float: left;
      width: 50%;
      height: 100%;
      background-color: rgb(178, 178, 224);
    }
  </style>

  <body>
    <div id="app"></div>

    <template id="body">
      <div id="left">
        <h1>{{title}}</h1>
        <ol>
          <li v-for="msg in ctrlcMsgs">{{ msg }}</li>
        </ol>
      </div>
      <div id="right">
        <h1>{{search}}</h1>
        <span id="zuo">
          <input type="text" name="search" />
          <button type="submit">查询</button>
        </span>
        <span id="you">
          <p>count:</p>
          <input type="number" :value="count" />
          <p>offset:</p>
          <input type="number" :value="offset" />
        </span>
        <ol>
          <li v-for="msg in searchMsgs">{{ msg }}</li>
        </ol>
      </div>
    </template>

    <script src="vue.global.js"></script>
    <script>
      Vue.createApp({
        template: "#body",
        data() {
          return {
            title: "hello ctrlc !!!",
            search: "search !!!",
            ctrlcMsgs: [],
            searchMsg:"",
            count: 30,
            offset: 0,
            searchMsgs: [],
          };
        },
        props: {},
        computed: {},
        watch: {
        },
        methods: {},
        created() {
          // console.log(this.ctrlcMsgs);
          var msgs = this.ctrlcMsgs; // == msgs=this.ctrlcMsgs 都是赋值指针类型
          const source = new EventSource("/msgs");
          source.addEventListener("open", function (event) {
            console.log("eventsource connection open");
          });
          source.addEventListener("error", function (event) {
            if (event.target.readyState === 0) {
              console.log("reconnecting to eventsource");
            } else {
              console.error("eventsource error");
            }
          });
          source.addEventListener("message", function (event) {
            console.log(event.data);
            // msgs.push(event.data);// 向后追加
            msgs.unshift(event.data); // 向前追加
            // console.log("msgs:", msgs);
          });
        },
      }).mount("#app");

      console.log("js run end ...");
    </script>
